name: Build Android app

# Every push builds a signed APK and publishes it as a GitHub Release named
# "Build <n>". The app's Settings > "App updates" button reads the latest
# release, shows its build number and who pushed it, and installs it.

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build metadata
        id: meta
        env:
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
        run: |
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --pretty=%s | tr -d '\r' | head -c 200)" >> "$GITHUB_OUTPUT"

      - name: Use signing key from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Test core (DSP, decoders, direction finding, updates)
        run: ./gradlew :core:test --stacktrace

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.number }}
          BUILD_AUTHOR: ${{ steps.meta.outputs.author }}
          BUILD_COMMIT: ${{ steps.meta.outputs.sha }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "signal-detector-build-${BUILD_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: signal-detector-build-${{ steps.meta.outputs.number }}
          path: signal-detector-build-*.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.meta.outputs.number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ steps.meta.outputs.number }}
          make_latest: "true"
          files: signal-detector-build-*.apk
          body: |
            Build: ${{ steps.meta.outputs.number }}
            Author: ${{ steps.meta.outputs.author }}
            Commit: ${{ steps.meta.outputs.sha }}
            Branch: ${{ github.ref_name }}
            Message: ${{ steps.meta.outputs.subject }}
